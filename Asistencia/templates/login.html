
{% extends 'home.html' %}

{% block title %}Login{% endblock %}

{% block content %}
    <h2>Iniciar Sesion</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Iniciar sesión</button>
    </form>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-warning">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

{% endblock %}
